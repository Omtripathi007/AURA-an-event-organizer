<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA — Admin Portal</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Outfit:wght@200;300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --sidebar-width: 260px;
        }

        .dashboard-layout {
            display: flex;
            min-height: 100vh;
            position: relative;
            z-index: 2;
        }

        /* ─── SIDEBAR ─── */
        .sidebar {
            width: var(--sidebar-width);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(40px);
            border-right: 1px solid var(--glass-border);
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 1001;
            top: 0;
            left: 0;
            transform: none !important;
        }

        .sidebar-logo {
            margin-bottom: 48px;
            padding-left: 12px;
        }

        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: static !important;
            width: 100% !important;
            background: transparent !important;
            border: none !important;
            backdrop-filter: none !important;
            padding: 0 !important;
            box-shadow: none !important;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            color: var(--muted);
            text-decoration: none;
            border-radius: 12px;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            transition: all 0.3s;
            margin-bottom: 8px;
        }

        .nav-item:hover,
        .nav-item.active {
            background: rgba(0, 118, 255, 0.08);
            color: var(--purple);
        }

        .nav-item svg {
            width: 18px;
            height: 18px;
            opacity: 0.7;
        }

        .nav-item.active svg {
            color: var(--purple-light);
            opacity: 1;
        }

        /* ─── MAIN CONTENT ─── */
        .main-dash {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 40px 56px;
        }

        @media (max-width: 1024px) {
            .sidebar {
                width: 80px;
                padding: 40px 10px;
                align-items: center;
            }

            .sidebar-logo {
                display: none;
            }

            .nav-item span {
                display: none;
            }

            .main-dash {
                margin-left: 80px;
                padding: 40px 24px;
            }
        }

        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .dash-title h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.22rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .dash-title span {
            color: var(--purple);
        }

        /* ─── EVENT LIST ─── */
        .dash-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .events-table-wrap {
            background: var(--card);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(16px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            padding: 20px 24px;
            font-size: 0.72rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(0, 118, 255, 0.02);
        }

        td {
            padding: 24px;
            border-bottom: 1px solid var(--glass-border);
            font-size: 0.88rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(124, 58, 237, 0.03);
        }

        .action-btn {
            background: rgba(0, 118, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--purple);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 8px;
        }

        .action-btn:hover {
            box-shadow: 0 4px 12px rgba(0, 118, 255, 0.2);
        }

        .btn-approve {
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            border-color: rgba(34, 197, 94, 0.2);
        }

        .btn-approve:hover {
            background: #4ade80;
            color: #fff;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.2);
        }

        .btn-reject {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.2);
        }

        .btn-reject:hover {
            background: #f87171;
            color: #fff;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }

        /* ─── MODAL ─── */
        .admin-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(13, 17, 23, 0.85);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .admin-modal {
            background: var(--card);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            transform: translateY(20px);
            transition: transform 0.3s;
        }

        .admin-modal-overlay.active {
            opacity: 1;
        }

        .admin-modal-overlay.active .admin-modal {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 16px;
        }

        .modal-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem;
            font-weight: 600;
            margin: 0;
        }

        .modal-host {
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: 4px;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.3s;
        }

        .modal-close:hover {
            color: #fff;
        }

        .modal-content-grid {
            display: grid;
            gap: 20px;
        }

        .modal-field {
            margin-bottom: 8px;
        }

        .modal-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .modal-value {
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .modal-image {
            width: 100%;
            height: 200px;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 20px;
            border: 1px solid var(--glass-border);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--glass-border);
        }
    </style>
</head>

<body>
    <!-- Custom Cursor -->
    <div id="cursor"></div>
    <div id="cursor-ring"></div>

    <!-- BG Canvas -->
    <canvas id="bg-canvas"></canvas>

    <!-- Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <nav id="mainNav" class="mobile-only-nav" style="display: none; height: 70px; padding: 0 24px;">
        <div class="nav-logo" onclick="window.location.href='index.html'">AURA</div>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle Navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </nav>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <div class="nav-logo">AURA</div>
            </div>
            <div class="sidebar-nav">
                <a href="#" class="nav-item active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 20h9" />
                        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
                    </svg>
                    <span>Curation Queue</span>
                </a>
            </div>
            <div class="sidebar-footer">
                <a href="#" onclick="logout();" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                        <polyline points="16 17 21 12 16 7" />
                        <line x1="21" y1="12" x2="9" y2="12" />
                    </svg>
                    <span>Exit Portal</span>
                </a>
            </div>
        </aside>

        <main class="main-dash">
            <div id="overview-section">
                <header class="dash-header">
                    <div class="dash-title">
                        <p class="section-label">✦ Supreme Authority</p>
                        <h1>Event <span>Curation</span> Queue</h1>
                    </div>
                </header>

                <div class="dash-section-header">
                    <h2 class="form-section-title">Pending Approvals</h2>
                </div>

                <div class="events-table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Event Request</th>
                                <th>Host Details</th>
                                <th>Content Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="admin-table-body">
                            <tr><td colspan="4" style="text-align: center; padding: 40px; color: var(--muted);">Loading Queue...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Details Modal -->
    <div class="admin-modal-overlay" id="details-modal">
        <div class="admin-modal">
            <div class="modal-header">
                <div>
                    <h2 class="modal-title" id="m-title">Loading...</h2>
                    <div class="modal-host" id="m-host">by Someone</div>
                </div>
                <button class="modal-close" onclick="closeDetailsModal()">×</button>
            </div>
            
            <img id="m-image" class="modal-image" src="" alt="Event Banner" style="display: none;">

            <div class="modal-content-grid">
                <div class="modal-field">
                    <div class="modal-label">Full Description</div>
                    <div class="modal-value" id="m-desc">...</div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="modal-field">
                        <div class="modal-label">Date & Time</div>
                        <div class="modal-value" id="m-date">...</div>
                    </div>
                    <div class="modal-field">
                        <div class="modal-label">Location</div>
                        <div class="modal-value" id="m-loc">...</div>
                    </div>
                    <div class="modal-field">
                        <div class="modal-label">Ticket Price</div>
                        <div class="modal-value" id="m-price">...</div>
                    </div>
                    <div class="modal-field">
                        <div class="modal-label">Categories</div>
                        <div class="modal-value" id="m-cat">...</div>
                    </div>
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn-ghost" style="flex: 1;" onclick="closeDetailsModal()">Close</button>
                <div style="flex: 2; display: flex; gap: 12px; justify-content: flex-end;" id="m-action-btns">
                    <!-- Injected buttons -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        let globalPendingEvents = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadAdminQueue();
        });

        async function loadAdminQueue() {
            const token = localStorage.getItem('token');
            if(!token) {
                window.location.href = 'login-signup.html';
                return;
            }

            try {
                const res = await fetch('http://localhost:3000/api/admin/events/pending', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if(!res.ok) throw new Error('Unauthorised or session expired.');
                globalPendingEvents = await res.json();
                
                const tableBody = document.getElementById('admin-table-body');
                if (globalPendingEvents.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 40px; color: var(--muted);">No pending events right now. You are all caught up!</td></tr>';
                    return;
                }

                tableBody.innerHTML = globalPendingEvents.map((ev, index) => `
                    <tr>
                        <td>
                            <div style="font-weight: 500;">${ev.title}</div>
                            <div style="font-size: 0.75rem; color: var(--muted);">${ev.location}</div>
                        </td>
                        <td>
                            <div style="font-weight: 500;">${ev.host.name}</div>
                        </td>
                        <td>${new Date(ev.date).toLocaleDateString()}</td>
                        <td>
                            <button class="action-btn" onclick="openDetailsModal(${index})">Review Details</button>
                            <button class="action-btn btn-approve" onclick="reviewEvent(${ev.id}, 'APPROVED')">Approve</button>
                            <button class="action-btn btn-reject" onclick="reviewEvent(${ev.id}, 'REJECTED')">Reject</button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                alert(error.message);
                window.location.href = 'login-signup.html';
            }
        }

        function openDetailsModal(index) {
            const ev = globalPendingEvents[index];
            if(!ev) return;

            document.getElementById('m-title').innerText = ev.title;
            document.getElementById('m-host').innerText = `by ${ev.host.name}`;
            
            const imgParams = document.getElementById('m-image');
            if(ev.image) {
                imgParams.src = ev.image;
                imgParams.style.display = 'block';
            } else {
                imgParams.style.display = 'none';
            }

            document.getElementById('m-desc').innerText = ev.description;
            document.getElementById('m-date').innerText = new Date(ev.date).toLocaleString();
            document.getElementById('m-loc').innerText = ev.location;
            document.getElementById('m-price').innerText = ev.price > 0 ? `$${ev.price}` : 'Free';
            document.getElementById('m-cat').innerText = ev.categories ? ev.categories.map(c => c.name).join(', ') : 'None';

            document.getElementById('m-action-btns').innerHTML = `
                <button class="btn-primary" style="background:#f87171; border-color:#f87171;" onclick="reviewEvent(${ev.id}, 'REJECTED'); closeDetailsModal();">Reject Event</button>
                <button class="btn-primary" style="background:#4ade80; border-color:#4ade80; color:#000;" onclick="reviewEvent(${ev.id}, 'APPROVED'); closeDetailsModal();">Approve Event</button>
            `;

            const modal = document.getElementById('details-modal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);
        }

        function closeDetailsModal() {
            const modal = document.getElementById('details-modal');
            modal.classList.remove('active');
            setTimeout(() => modal.style.display = 'none', 300);
        }

        async function reviewEvent(id, status) {
            if(!confirm(`Are you sure you want to ${status.toLowerCase()} this event?`)) return;
            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`http://localhost:3000/api/admin/events/${id}/status`, {
                    method: 'PATCH',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify({ status })
                });

                if(!res.ok) throw new Error('Failed to update event state');
                loadAdminQueue(); // Refresh the queue
            } catch (error) {
                alert(error.message);
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
